<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login & Signup</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .btn-custom {
            width: 100%;
            border-radius: 10px;
            padding: 10px;
        }

        #loginForm {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- SIGNUP FORM -->
        <div id="signupForm" class="form-box mx-auto">

            <h2>Sign Up</h2>

            <form>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" placeholder="Enter phone number">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Enter password">
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" placeholder="Confirm password">
                </div>

                <button type="button" id="nextBtn"
                        class="btn btn-primary btn-custom">
                    Next
                </button>

            </form>

            <p class="text-center mt-3">
                Already have an account?
                <a href="#" id="showLogin">Login</a>
            </p>

        </div>


        <!-- LOGIN FORM -->
        <div id="loginForm" class="form-box mx-auto">

            <h2>Login</h2>

            <form>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control"
                           placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control"
                           placeholder="Enter your password">
                </div>

                <button type="button" id="submitBtn"
                        class="btn btn-success btn-custom">
                    Submit
                </button>

            </form>

            <p class="text-center mt-3">
                Don't have an account?
                <a href="#" id="showSignup">Sign Up</a>
            </p>

        </div>

    </div>


    <!-- jQuery Animation -->
    <script>

        $(document).ready(function () {

            // Signup form slow ga open
            $("#signupForm").hide().fadeIn(2000);


            // Next button
            $("#nextBtn").click(function () {

                $("#signupForm").fadeOut(1500, function () {

                    $("#loginForm").fadeIn(2000);

                });

            });


            // Login link
            $("#showLogin").click(function (e) {

                e.preventDefault();

                $("#signupForm").fadeOut(1500, function () {

                    $("#loginForm").fadeIn(2000);

                });

            });


            // Signup link
            $("#showSignup").click(function (e) {

                e.preventDefault();

                $("#loginForm").fadeOut(1500, function () {

                    $("#signupForm").fadeIn(2000);

                });

            });


            // Submit button
            $("#submitBtn").click(function () {

                $("#loginForm").fadeOut(1500);

            });

        });

    </script>

</body>
</html>
