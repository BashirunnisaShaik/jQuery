<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login & Signup</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- jQuery -->
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(
                135deg,
                white,
                rgb(20, 99, 130),
                white
            );

            font-family: Arial, sans-serif;
        }


        /* Main container */

        .container-box {

            width: 900px;

            max-width: 95%;

            min-height: 550px;

            display: flex;

            background: rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(15px);

            border-radius: 25px;

            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);
        }


        /* Left side */

        .left-side {

            width: 45%;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            color: white;

            padding: 40px;

            background: rgba(255, 255, 255, 0.12);
        }


        .left-side h1 {

            font-size: 42px;

            font-weight: bold;
        }


        .left-side p {

            font-size: 17px;

            line-height: 1.6;
        }


        /* Form side */

        .right-side {

            width: 55%;

            background: white;

            padding: 50px;
        }


        .form-box {

            width: 100%;
        }


        .form-title {

            text-align: center;

            font-weight: bold;

            font-size: 32px;

            margin-bottom: 30px;

            color: #333;
        }


        /* Input */

        .input-box {

            position: relative;

            margin-bottom: 20px;
        }


        .input-box i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #764ba2;
        }


        .input-box input {

            width: 100%;

            padding: 13px 15px 13px 45px;

            border: none;

            border-radius: 12px;

            background: #f2f3f7;

            outline: none;

            transition: 0.3s;
        }


        .input-box input:focus {

            background: white;

            box-shadow:
                0 0 0 2px #764ba2;
        }


        /* Error messages */

        .text-danger {

            color: red;

            font-size: 13px;

            display: block;

            margin-top: 5px;
        }


        /* Button */

        .btn-custom {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            font-weight: bold;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            transition: 0.3s;
        }


        .btn-custom:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(118, 75, 162, 0.4);
        }
        .switch-text {

            text-align: center;

            margin-top: 25px;

            color: #666;
        }


        .switch-text a {

            color: #764ba2;

            font-weight: bold;

            text-decoration: none;
        }


        .switch-text a:hover {

            text-decoration: underline;
        }


        /* Login hidden initially */

        #loginForm {

            display: none;
        }


        /* Reset hidden initially */

        #resetForm {

            display: none;
        }


        /* Mobile */

        @media (max-width: 768px) {

            .container-box {

                flex-direction: column;
            }


            .left-side {

                width: 100%;

                padding: 25px;
            }


            .left-side h1 {

                font-size: 30px;
            }


            .right-side {

                width: 100%;

                padding: 30px;
            }

        }

    </style>

</head>


<body>


<div class="container-box">

    <!-- LEFT SIDE -->
    <div class="left-side">

        <div>

            <h1>
                Welcome!
            </h1>

            <p>

                Create your account and join us.

                <br>

                Login to continue your journey.

            </p>

        </div>

    </div>

    <!-- RIGHT SIDE -->
    
    <div class="right-side">

        <!-- SIGNUP FORM -->
        <div
            id="signupForm"
            class="form-box"
        >

            <h2 class="form-title">

                Create Account

            </h2>


            <form>


                <!-- NAME -->

                <div class="input-box">

                    <i class="bi bi-person"></i>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Full Name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="input-box">

                    <i class="bi bi-envelope"></i>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Email Address"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="input-box">

                    <i class="bi bi-telephone"></i>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Phone Number"
                        maxlength="10"
                    >

                    <small
                        id="phoneError"
                        class="text-danger">
                    </small>

                </div>


                <!-- PASSWORD -->

                <div class="input-box">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Password"
                    >

                    <small
                        id="signupPasswordError"
                        class="text-danger">
                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-box">

                    <i class="bi bi-shield-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                    >

                    <small
                        id="confirmPasswordError"
                        class="text-danger">
                    </small>

                </div>


                <!-- NEXT BUTTON -->

                <button
                    type="button"
                    id="nextBtn"
                    class="btn-custom">

                    Next

                </button>


            </form>


            <div class="switch-text">

                Already have an account?

                <a
                    href="#"
                    id="showLogin">

                    Login

                </a>

            </div>

        </div>

        <!-- RESET PASSWORD FORM -->

        <div
            id="resetForm"
            class="form-box"
        >

            <h2 class="form-title">

                Reset Password

            </h2>


            <!-- NEW PASSWORD -->

            <div class="input-box">

                <i class="bi bi-lock"></i>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="New Password"
                >

                <small
                    id="newPasswordError"
                    class="text-danger">
                </small>

            </div>


            <!-- CONFIRM NEW PASSWORD -->

            <div class="input-box">

                <i class="bi bi-shield-lock"></i>

                <input
                    type="password"
                    id="resetConfirmPassword"
                    placeholder="Confirm New Password"
                >

                <small
                    id="resetConfirmError"
                    class="text-danger">
                </small>

            </div>


            <!-- RESET BUTTON -->

            <button
                type="button"
                id="resetBtn"
                class="btn-custom">

                Reset Password

            </button>


            <!-- BACK TO LOGIN -->

            <div class="switch-text">

                Remember your password?

                <a
                    href="#"
                    id="backToLogin">

                    Login

                </a>

            </div>

        </div>

        <!-- LOGIN FORM -->
       

        <div
            id="loginForm"
            class="form-box"
    
            <h2 class="form-title">

                Welcome Back to login !

            </h2>
            <form>


                <!-- EMAIL -->

                <div class="input-box">

                    <i class="bi bi-envelope"></i>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email Address"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-box">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                    >

                    <small
                        id="loginPasswordError"
                        class="text-danger">
                    </small>

                </div>


                <!-- FORGOT PASSWORD -->

                <div class="text-end mb-3">

                    <a
                        href="#"
                        id="forgotPassword"
                        style="
                            color:#764ba2;
                            text-decoration:none;
                        ">

                        Forgot Password?

                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="button"
                    id="submitBtn"
                    class="btn-custom">

                    Login

                </button>


            </form>


            <div class="switch-text">

                Don't have an account?

                <a
                    href="#"
                    id="showSignup">

                    Sign Up

                </a>

            </div>

        </div>


    </div>

</div>

<!-- jQuery -->
<script>

$(document).ready(function () {

    // INITIAL STATE
    $("#signupForm").show();

    $("#loginForm").hide();

    $("#resetForm").hide();


    // Hide all error messages initially

    $("#phoneError").hide();

    $("#signupPasswordError").hide();

    $("#confirmPasswordError").hide();

    $("#newPasswordError").hide();

    $("#resetConfirmError").hide();

    $("#loginPasswordError").hide();

    // PHONE VALIDATION

    $("#phone").on("input", function () {

        let phone = $(this).val();


        if (/[^0-9]/.test(phone)) {

            $("#phoneError")
                .text("Only numbers are allowed")
                .show();

        }
        else {

            $("#phoneError")
                .text("")
                .hide();

        }

    });

    // SIGNUP PASSWORD VALIDATION
   $("#signupPassword").on("keyup", function () {

        let password = $(this).val();


        if (password.length < 6) {

            $("#signupPasswordError")
                .text("Password must be at least 6 characters")
                .show();

        }
        else {

            $("#signupPasswordError")
                .text("")
                .hide();

        }

    });

    // SIGNUP CONFIRM PASSWORD
    $("#confirmPassword").on("keyup", function () {

        let password =
            $("#signupPassword").val();

        let confirmPassword =
            $(this).val();


        if (password !== confirmPassword) {

            $("#confirmPasswordError")
                .text("Passwords do not match")
                .show();

        }
        else {

            $("#confirmPasswordError")
                .text("")
                .hide();

        }

    });

    // SIGNUP → LOGIN

    $("#showLogin").click(function (e) {

        e.preventDefault();


        $("#signupForm").animate(
            {
                height: "hide"
            },
            500,
            function () {

                $("#loginForm").animate(
                    {
                        height: "show"
                    },
                    500
                );

            }
        );

    });

    // LOGIN → SIGNUP
    $("#showSignup").click(function (e) {

        e.preventDefault();


        $("#loginForm").animate(
            {
                height: "hide"
            },
            500,
            function () {

                $("#signupForm").animate(
                    {
                        height: "show"
                    },
                    500
                );

            }
        );

    });

    // FORGOT PASSWORD → RESET PASSWORD
    $("#forgotPassword").click(function (e) {

        e.preventDefault();


        $("#loginForm").animate(
            {
                height: "hide"
            },
            500,
            function () {

                $("#resetForm").animate(
                    {
                        height: "show"
                    },
                    500
                );

            }
        );

    });

    // RESET PASSWORD VALIDATION
    $("#newPassword").on("keyup", function () {

        let password =
            $(this).val();


        if (password.length < 6) {

            $("#newPasswordError")
                .text("Password must be at least 6 characters")
                .show();

        }
        else {

            $("#newPasswordError")
                .text("")
                .hide();

        }

    });

    // RESET CONFIRM PASSWORD
    $("#resetConfirmPassword").on("keyup", function () {

        let password =
            $("#newPassword").val();

        let confirmPassword =
            $(this).val();

        if (password !== confirmPassword) {

            $("#resetConfirmError")
                .text("Passwords do not match")
                .show();

        }
        else {

            $("#resetConfirmError")
                .text("")
                .hide();

        }
    });
    // RESET PASSWORD BUTTON
    $("#resetBtn").click(function (e) {

        e.preventDefault();
        let password =
            $("#newPassword").val();

        let confirmPassword =
            $("#resetConfirmPassword").val();
        // Check password length
        if (password.length < 6) {

            $("#newPasswordError")
                .text("Password must be at least 6 characters")
                .show();

            return;

        }
        // Check password match
        if (password !== confirmPassword) {

            $("#resetConfirmError")
                .text("Passwords do not match")
                .show();

            return;

        }


        // SUCCESS

        alert("Password reset successful!");


        // RESET → LOGIN WITH JQUERY ANIMATION

        $("#resetForm").animate(
            {
                height: "hide"
            },
            500,
            function () {

                $("#loginForm").animate(
                    {
                        height: "show"
                    },
                    500
                );

            }
        );
        // Clear fields
        $("#newPassword").val("");

        $("#resetConfirmPassword").val("");

        $("#newPasswordError").hide();

        $("#resetConfirmError").hide();

    });
    // BACK TO LOGIN
    $("#backToLogin").click(function (e) {

        e.preventDefault();


        $("#resetForm").animate(
            {
                height: "hide"
            },
            500,
            function () {

                $("#loginForm").animate(
                    {
                        height: "show"
                    },
                    500
                );

            }
        );

    });

    // NEXT BUTTON
     $("#nextBtn").click(function () {
        let phone =
            $("#phone").val();

        let password =
            $("#signupPassword").val();

        let confirmPassword =
            $("#confirmPassword").val();
        // PHONE

        if (!/^[0-9]{10}$/.test(phone)) {

            $("#phoneError")
                .text("Invalid phone number")
                .show();

            return;

        }
        // PASSWORD
        if (password.length < 6) {

            $("#signupPasswordError")
                .text("Password must be at least 6 characters")
                .show();

            return;

        }
        // CONFIRM PASSWORD

        if (password !== confirmPassword) {

            $("#confirmPasswordError")
                .text("Passwords do not match")
                .show();

            return;

        }


        // ALL CORRECT → LOGIN

        $("#signupForm").animate(
            {
                height: "hide"
            },
            500,
            function () {

                $("#loginForm").animate(
                    {
                        height: "show"
                    },
                    500
                );

            }
       );
    });

    // LOGIN BUTTON
       $("#submitBtn").click(function () {

        alert("Login successful!");

    });
});
</script>
</body>
</html>
